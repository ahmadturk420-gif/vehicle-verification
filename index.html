<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PakWheels Mini - Auto Marketplace</title>
  <!-- Tailwind CSS CDN for modern responsive UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased m-h-screen">

  <!-- Header -->
  <header class="bg-blue-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight">AutoMarket <span class="text-blue-300 text-sm">Rawalpindi/ISB</span></h1>
      <button onclick="toggleModal(true)" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded shadow transition">
        + Post a Vehicle
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Filter and Search Bar -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Search Model / Title</label>
        <input type="text" id="searchInput" placeholder="e.g. Corolla, Civic..." class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Filter by Make</label>
        <select id="makeFilter" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
          <option value="">All Makes</option>
          <option value="Toyota">Toyota</option>
          <option value="Honda">Honda</option>
          <option value="Suzuki">Suzuki</option>
          <option value="Hyundai">Hyundai</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">City</label>
        <select id="cityFilter" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
          <option value="">All Cities</option>
          <option value="Rawalpindi">Rawalpindi</option>
          <option value="Islamabad">Islamabad</option>
          <option value="Lahore">Lahore</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Max Price (PKR)</label>
        <input type="number" id="priceFilter" placeholder="e.g. 2000000" class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
      </div>
    </div>

    <!-- Listings Grid -->
    <div id="carsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Injected via JavaScript -->
    </div>

    <div id="emptyMessage" class="hidden text-center py-12 text-gray-500 font-medium">
      No vehicles match your search filter criteria.
    </div>

  </main>

  <!-- Add Car Modal Form -->
  <div id="carModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl relative">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Add New Vehicle Listing</h2>
      
      <form id="addCarForm" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600">Vehicle Title</label>
          <input type="text" id="title" required placeholder="e.g. Toyota Corolla Indus 1.6" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600">Make</label>
            <select id="make" class="w-full border rounded px-3 py-1.5 text-sm">
              <option value="Toyota">Toyota</option>
              <option value="Honda">Honda</option>
              <option value="Suzuki">Suzuki</option>
              <option value="Hyundai">Hyundai</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600">Model Year</label>
            <input type="number" id="model_year" required placeholder="1993" class="w-full border rounded px-3 py-1.5 text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600">Price (PKR)</label>
            <input type="number" id="price" required placeholder="1250000" class="w-full border rounded px-3 py-1.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600">Mileage (KM)</label>
            <input type="number" id="mileage" required placeholder="185000" class="w-full border rounded px-3 py-1.5 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600">City</label>
          <select id="city" class="w-full border rounded px-3 py-1.5 text-sm">
            <option value="Rawalpindi">Rawalpindi</option>
            <option value="Islamabad">Islamabad</option>
            <option value="Lahore">Lahore</option>
          </select>
        </div>

        <div id="formStatus" class="text-xs font-bold pt-1"></div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded hover:bg-gray-300">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded hover:bg-blue-700">Save Listing</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
